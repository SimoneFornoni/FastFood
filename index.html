<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fast Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body">
    <div class="min-vh-100 d-flex justify-content-center align-items-center bg-warning-subtle bg-gradient py-3">
        <div class="container border-0 shadow-lg p-3 p-md-4 p-lg-5 rounded-4 mx-3 bg-light" style="max-width: 600px;">
            
            <!-- Header with authentication options -->
            <header class="row mb-3 mb-md-4 g-2">
                <div class="col-12 col-sm-8 text-center text-sm-start mb-2 mb-sm-0">
                    <h1 class="fw-bold fs-3 fs-md-2 fs-lg-1">
                        <i class="bi bi-cup-hot-fill me-2 text-warning"></i>Fast Food
                    </h1>
                </div>
                <div class="col-12 col-sm-4 d-flex justify-content-center justify-content-sm-end align-items-center">
                    <div class="btn-group shadow-sm" role="group" aria-label="Authentication options" style="max-width: 300px;">
                        <button id="changeToSignIn" type="button" class="btn btn-warning fw-semibold px-2 px-md-3" onclick="goToSignIn()">
                            <i class="bi bi-person-plus me-1"></i><span class="d-none d-sm-inline">Registrati</span><span class="d-inline d-sm-none">Reg.</span>
                        </button>
                        <button id="changeToLogIn" type="button" class="btn btn-outline-warning fw-semibold px-2 px-md-3" onclick="goToLogIn()">
                            <i class="bi bi-box-arrow-in-right me-1"></i><span class="d-none d-sm-inline">Accedi</span><span class="d-inline d-sm-none">Acc.</span>
                        </button>
                    </div>
                </div>
            </header>
            
            <!-- Sign In Form -->
            <main id="signIn" class="container-fluid px-0">
                <div class="text-center mb-3 mb-md-4">
                    <h2 class="text-dark fw-bold fs-4 fs-md-3">
                        <i class="bi bi-person-plus-fill me-2 text-warning"></i>Crea il tuo account
                    </h2>
                </div>
                
                <div class="mb-3 mb-md-4">
                    <label for="siRole" class="form-label fw-semibold">
                        <i class="bi bi-person-gear me-1"></i>Tipo di account
                    </label>
                    <select class="form-select shadow-sm w-50" id="siRole" onchange="changeInputFields()">
                        <option value="customer">Cliente</option>
                        <option value="restaurateur">Ristoratore</option>
                    </select>
                </div>
                
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-3 p-md-4">
                        <h5 class="card-title mb-3 fs-6 fs-md-5" id="cardTitle">
                            <i class="bi bi-person-fill me-2 text-warning" id="cardIcon"></i><span id="cardTitleText">Informazioni personali</span>
                        </h5>
                        
                        <div id="signInForm">
                            <div class="row mb-3 g-2 g-md-3">
                                <div class="col-12 col-md-6">
                                    <label for="name" class="form-label fw-semibold small">Nome *</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="name" placeholder="Il tuo nome">
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label for="lastName" class="form-label fw-semibold small">Cognome *</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="lastName" placeholder="Il tuo cognome">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Indirizzo Email *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="email@esempio.com">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold small">Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Password sicura">
                                </div>
                            </div>

                            <!-- Customer-specific fields -->
                            <div id="customerFields">
                                <h6 class="text-secondary mb-3 mt-3 mt-md-4 small">
                                    <i class="bi bi-gear-fill me-2"></i>Preferenze
                                </h6>
                                <div class="row g-2 g-md-3">
                                    <div class="col-12 col-md-6 mb-2 mb-md-3">
                                        <label for="paymentMethod" class="form-label fw-semibold small">Pagamento *</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-credit-card"></i></span>
                                            <select class="form-select" id="paymentMethod">
                                                <option value="creditCard">Carta di Credito</option>
                                                <option value="prepaidCard">Carta Prepagata</option>
                                                <option value="paypal">PayPal</option>
                                                <option value="cash">In Cassa</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6 mb-2 mb-md-3">
                                        <label for="preference" class="form-label fw-semibold small">Preferenza *</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-heart"></i></span>
                                            <select class="form-select" id="preference">
                                                <option value="first">Primi Piatti</option>
                                                <option value="second">Secondi Piatti</option>
                                                <option value="dessert">Dessert</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Restaurateur-specific fields -->
                            <div id="restaurateurFields" class="d-none">
                                <h6 class="text-secondary mb-3 mt-3 mt-md-4 small">
                                    <i class="bi bi-building me-2"></i>Dati Aziendali
                                </h6>
                                <div class="row mb-3 g-2 g-md-3">
                                    <div class="col-12 col-md-6">
                                        <label for="phone" class="form-label fw-semibold small">Telefono *</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                            <input type="tel" class="form-control" id="phone" placeholder="123 456 7890">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="pIva" class="form-label fw-semibold small">Partita IVA *</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-file-earmark-text"></i></span>
                                            <input type="text" class="form-control" id="pIva" placeholder="12345678910">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid d-md-flex justify-content-md-end mt-3 mt-md-4">
                                <button type="button" id="siBtn" class="btn btn-warning btn-lg fw-semibold shadow-sm" onclick="signIn()">
                                    <i class="bi bi-person-plus me-2"></i><span class="d-none d-sm-inline">Crea Account</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Log In Form -->
            <div id="logIn" class="container-fluid px-0 d-none">
                <div class="text-center mb-3 mb-md-4">
                    <h2 class="text-dark fw-bold fs-4 fs-md-3">
                        <i class="bi bi-box-arrow-in-right me-2 text-warning"></i>Accedi al tuo account
                    </h2>
                </div>
                
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-3 p-md-4">
                        <div class="mb-3 mb-md-4">
                            <label for="liEmail" class="form-label fw-semibold small">Indirizzo Email *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="liEmail" placeholder="email@esempio.com" required>
                            </div>
                        </div>
                        <div class="mb-3 mb-md-4">
                            <label for="liPassword" class="form-label fw-semibold small">Password *</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="liPassword" placeholder="La tua password" required>
                            </div>
                        </div>
                        <div class="d-grid d-md-flex justify-content-md-end">
                            <button type="button" id="liBtn" class="btn btn-warning btn-lg fw-semibold shadow-sm" onclick="logIn()">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Accedi
                            </button> 
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Alerts for error and success messages -->
    <div class="alert alert-danger d-none mt-2 mt-md-3 mb-1 shadow-sm" id="errorAlert" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span id="errorMessage"></span>
    </div>
    <div class="alert alert-success d-none mt-2 mt-md-3 mb-1 shadow-sm" id="successAlert" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span id="successMessage"></span>
    </div>

    <style>
        .alert-danger , .alert-success{
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1050;
        width: 350px;
    }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>

    <script>
        // Function called on form submission to log in the user
        // - It retrieves the email and password from the input fields and sends a GET request to the server to authenticate the user.
        // - If the user is authenticated successfully, it stores the user data in session storage and redirects to the appropriate page based on the user's role.
        // - If the user is not authenticated, it displays an error message.
        function logIn() {
            const email = document.getElementById('liEmail').value;
            const password = document.getElementById('liPassword').value;

            const user = {
                email: email,
                password: password
            };

            const options = {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(user)
            };

            fetch("http://localhost:3005/login", options)
                .then(res => res.json())
                .then(data => {
                    if (data.message && data.user) {
                        showAlert(data.message, 'success');

                        const userData = {
                            _id: data.user._id,
                            role: data.user.role,
                            username: data.user.username
                        };

                        if (userData.role === 'customer') {
                            userData.preference = data.user.preference;

                            sessionStorage.setItem('userData', JSON.stringify(userData));
                            window.location.href = 'lib/restaurants.html';
                        } else {
                            sessionStorage.setItem('userData', JSON.stringify(userData));
                            window.location.href = 'lib/dashboardRest.html';
                        }
                    } else if (data.error) {
                        showAlert('Errore nell\'autenticazione: ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error('Errore nell\'autenticazione:' + error, 'error');
                    showAlert(`Errore nell'autenticazione: ${error.message}`, 'error');
                });
        }

        // Function called on form submission to register a new user (customer or restaurateur)
        // - It determines the role and collects the appropriate form data
        // - It sends a POST request to the server to create the new user
        // - If the registration is successful, it stores the user data in session storage and redirects to the appropriate page
        // - If there is an error, it displays an error message
        function signIn() {
            const role = document.getElementById('siRole').value;
            const userData = {
                name: document.getElementById('name').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            let url = '';

            if (role === 'customer') {
                userData.paymentMethod = document.getElementById('paymentMethod').value;
                userData.preference = document.getElementById('preference').value;
                url = 'http://localhost:3005/customers';
            } else {
                userData.phone = document.getElementById('phone').value;
                userData.pIva = document.getElementById('pIva').value;
                url = 'http://localhost:3005/restaurateurs';
            }

            const routeType = role === 'customer' ? 'customers' : 'restaurateurs';
            const options = {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(userData)
            };

            fetch(url, options)
                .then(res => res.json())
                .then(data => {
                    if (data.message) {
                        showAlert(data.message, 'success');

                        const sessionData = {
                            _id: data.insertedId,
                            role: role,
                            username: userData.name + " " + userData.lastName
                        };
                        
                        if (role === 'customer') {
                            sessionData.preference = userData.preference;

                            sessionStorage.setItem('userData', JSON.stringify(sessionData));
                            window.location.href = 'lib/restaurants.html';
                        } else {
                            sessionStorage.setItem('userData', JSON.stringify(sessionData));
                            window.location.href = 'lib/dashboardRest.html';
                        }
                    } else if (data.error) {
                        console.error('Errore nella registrazione:', data.error);
                        showAlert('Errore nella registrazione: ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error(`Errore nella creazione dell'utente: `, error);
                    showAlert(`Errore nella creazione dell'utente: ${error.message}`, 'error');
                });
        }

        // Functions to switch between Sign In and Log In forms
        // - They toggle the visibility of the respective forms and update the button styles accordingly.
        function goToSignIn() {
            document.getElementById('signIn').classList.remove('d-none');
            document.getElementById('logIn').classList.add('d-none');
            document.getElementById('changeToSignIn').classList.remove('btn-outline-warning');
            document.getElementById('changeToSignIn').classList.add('btn-warning');
            document.getElementById('changeToLogIn').classList.add('btn-outline-warning');
            document.getElementById('changeToLogIn').classList.remove('btn-warning');
        }

        function goToLogIn() {
            document.getElementById('signIn').classList.add('d-none');
            document.getElementById('logIn').classList.remove('d-none');
            document.getElementById('changeToSignIn').classList.remove('btn-warning');
            document.getElementById('changeToSignIn').classList.add('btn-outline-warning');
            document.getElementById('changeToLogIn').classList.add('btn-warning');
            document.getElementById('changeToLogIn').classList.remove('btn-outline-warning');
        }

        // Function to change input fields based on the selected role
        // - It shows or hides the appropriate input fields for customer or restaurateur based on the selected role
        // - Updates placeholders, button text, and card title accordingly
        function changeInputFields() {
            const role = document.getElementById('siRole').value;
            const customerFields = document.getElementById('customerFields');
            const restaurateurFields = document.getElementById('restaurateurFields');
            const nameInput = document.getElementById('name');
            const lastNameInput = document.getElementById('lastName');
            const emailInput = document.getElementById('email');
            const cardIcon = document.getElementById('cardIcon');
            const cardTitleText = document.getElementById('cardTitleText');
            
            if (role === 'restaurateur') {
                customerFields.classList.add('d-none');
                restaurateurFields.classList.remove('d-none');
                
                cardIcon.className = "bi bi-shop me-2 text-warning";
                cardTitleText.textContent = "Informazioni ristorante";
                
                nameInput.placeholder = "Nome proprietario";
                lastNameInput.placeholder = "Cognome proprietario";
                emailInput.placeholder = "ristorante@email.com";
            } else {
                restaurateurFields.classList.add('d-none');
                customerFields.classList.remove('d-none');
                
                cardIcon.className = "bi bi-person-fill me-2 text-warning";
                cardTitleText.textContent = "Informazioni personali";

                nameInput.placeholder = "Il tuo nome";
                lastNameInput.placeholder = "Il tuo cognome";
                emailInput.placeholder = "email@esempio.com";
            }
        }

        // Function to show alert messages
        // - It displays a success or error message based on the type of alert.
        function showAlert(message, type) {
            const alertElement = type === 'success' ? document.getElementById('successAlert') : document.getElementById('errorAlert');
            const otherAlert = type === 'success' ? document.getElementById('errorAlert') : document.getElementById('successAlert');
            const messageElement = type === 'success' ? document.getElementById('successMessage') : document.getElementById('errorMessage');
            
            otherAlert.classList.add('d-none');
            
            messageElement.textContent = message;
            alertElement.classList.remove('d-none');
            
            setTimeout(() => {
                alertElement.classList.add('d-none');
            }, 5000);
        }
    </script>
</body>
</html>
